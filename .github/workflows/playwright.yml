name: Playwright Automation CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Chạy hồi quy tự động mỗi đêm lúc 02:00 UTC (09:00 AM Giờ VN)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Môi trường kiểm thử (dev / staging)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
      test_suite:
        description: 'Phạm vi kiểm thử'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ad100
          - api
          - ui
          - e2e
          - smoke-aa000
          - gacha-limited
      workers:
        description: 'Số lượng workers song song'
        required: false
        default: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests (${{ inputs.environment || 'dev' }})
    timeout-minutes: 45
    runs-on: ubuntu-latest

    # Sử dụng GitHub Environment để lấy biến môi trường tương ứng (nếu cấu hình)
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (Binary & OS Deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS Dependencies only (when cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate .env.${{ inputs.environment || 'dev' }} file from Secrets
        env:
          TARGET_ENV: ${{ inputs.environment || 'dev' }}
          UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LOGIN_TYPE: ${{ secrets.LOGIN_TYPE || '1' }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ENV_FILE=".env.${TARGET_ENV}"
          cat <<EOF > "$ENV_FILE"
          UI_BASE_URL=${UI_BASE_URL}
          API_BASE_URL=${API_BASE_URL}
          BASIC_AUTH_USER=${BASIC_AUTH_USER}
          BASIC_AUTH_PASS=${BASIC_AUTH_PASS}
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_ID=${ADMIN_ID}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          LOGIN_TYPE=${LOGIN_TYPE}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          EOF
          echo "✅ Đã tạo file cấu hình $ENV_FILE thành công."

      - name: Pre-flight Backend Health Check
        env:
          TARGET_ENV: ${{ inputs.environment || 'dev' }}
        run: |
          source ".env.${TARGET_ENV}"
          echo "🔍 Kiểm tra trạng thái kết nối tới: $API_BASE_URL/api/v1/common/version..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$API_BASE_URL/api/v1/common/version" -u "$BASIC_AUTH_USER:$BASIC_AUTH_PASS" || echo "000")
          echo "HTTP Status Code nhận về: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "502" ] || [ "$HTTP_STATUS" = "503" ] || [ "$HTTP_STATUS" = "504" ] || [ "$HTTP_STATUS" = "000" ]; then
            echo "::error::❌ Máy chủ Backend API ($API_BASE_URL) hiện không phản hồi (Mã lỗi: HTTP $HTTP_STATUS). Hủy bỏ lượt chạy test ngay lập tức để tránh lãng phí thời gian retry vô ích."
            exit 1
          fi
          echo "✅ Máy chủ Backend phản hồi bình thường."

      - name: Execute Playwright Tests
        env:
          ENV: ${{ inputs.environment || 'dev' }}
          WORKERS: ${{ inputs.workers || '2' }}
          CI: true
        run: |
          SUITE="${{ inputs.test_suite }}"
          # Tự động nhận diện phạm vi test nếu chạy qua Pull Request
          if [ -z "$SUITE" ]; then
            BRANCH_REF="${{ github.head_ref || github.ref_name }}"
            echo "📌 Nhánh thực thi: $BRANCH_REF"
            if [[ "$BRANCH_REF" =~ "ad100" ]]; then
              SUITE="ad100"
            elif [[ "$BRANCH_REF" =~ "gacha" || "$BRANCH_REF" =~ "aq201" ]]; then
              SUITE="gacha-limited"
            elif [[ "$BRANCH_REF" =~ "aa000" ]]; then
              SUITE="smoke-aa000"
            elif [[ "$BRANCH_REF" =~ "docs" || "$BRANCH_REF" =~ "documentation" || "$BRANCH_REF" =~ "ci" ]]; then
              SUITE="ad100"
            else
              SUITE="all"
            fi
          fi

          echo "🚀 Bắt đầu thực thi: Suite [$SUITE] trên Môi trường [$ENV] (Fail-Fast limit: 5)..."
          FAIL_FAST_FLAG="--max-failures=5"

          case "$SUITE" in
            ad100)
              echo "🎯 Chạy riêng bộ kiểm thử AD100..."
              ENV=$ENV npx playwright test tests/**/ad100.*.spec.js $FAIL_FAST_FLAG
              ;;
            api)
              ENV=$ENV npx playwright test tests/api $FAIL_FAST_FLAG
              ;;
            ui)
              ENV=$ENV npx playwright test tests/ui $FAIL_FAST_FLAG
              ;;
            e2e)
              ENV=$ENV npx playwright test tests/e2e $FAIL_FAST_FLAG
              ;;
            smoke-aa000)
              ENV=$ENV npx playwright test tests/**/aa000.*.spec.js $FAIL_FAST_FLAG
              ;;
            gacha-limited)
              ENV=$ENV npx playwright test tests/ui/aq201.ui.spec.js $FAIL_FAST_FLAG
              ;;
            *)
              ENV=$ENV npx playwright test $FAIL_FAST_FLAG
              ;;
          esac

      - name: Upload HTML Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ inputs.environment || 'dev' }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Traces & Failure Evidence
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-evidence-${{ github.run_id }}
          path: |
            test-results/
            temp_trace/
          retention-days: 14

  deploy-report:
    name: Publish Report to GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download HTML Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-${{ inputs.environment || 'dev' }}-${{ github.run_id }}
          path: ./report

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
