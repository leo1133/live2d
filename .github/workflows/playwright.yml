name: Playwright Automation CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Chạy hồi quy tự động mỗi đêm lúc 02:00 UTC (09:00 AM Giờ VN)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Môi trường kiểm thử (dev / staging)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
      test_suite:
        description: 'Phạm vi kiểm thử'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - ad100
          - api
          - ui
          - e2e
          - smoke-aa000
          - gacha-limited
      workers:
        description: 'Số lượng workers song song'
        required: false
        default: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests (${{ inputs.environment || 'dev' }})
    timeout-minutes: 45
    runs-on: ubuntu-latest

    # Sử dụng GitHub Environment để lấy biến môi trường tương ứng (nếu cấu hình)
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout code (Full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Detect Test Scope (Smart PR Testing)
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🔍 Đang phân tích git diff cho Pull Request (Base: origin/${{ github.base_ref || 'main' }})..."
            node scripts/detect-pr-tests.js "origin/${{ github.base_ref || 'main' }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "📌 Sự kiện Push lên nhánh: ${{ github.ref_name }} -> Chạy Smoke Test xác nhận"
            echo "test_mode=SMOKE" >> $GITHUB_OUTPUT
            echo "test_files=tests/api/aa000.api.spec.js tests/ui/aa000.ui.spec.js tests/ui/ad100.ui.spec.js" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "🌙 Lịch Nightly Build: Chạy toàn bộ 1.040+ test..."
            echo "test_mode=ALL" >> $GITHUB_OUTPUT
            echo "test_files=all" >> $GITHUB_OUTPUT
          else
            # workflow_dispatch
            SELECTED_SUITE="${{ inputs.test_suite || 'all' }}"
            echo "🎯 Chạy thủ công: $SELECTED_SUITE"
            if [ "$SELECTED_SUITE" = "smoke" ]; then
              echo "test_mode=SMOKE" >> $GITHUB_OUTPUT
              echo "test_files=tests/api/aa000.api.spec.js tests/ui/aa000.ui.spec.js tests/ui/ad100.ui.spec.js" >> $GITHUB_OUTPUT
            elif [ "$SELECTED_SUITE" = "all" ]; then
              echo "test_mode=ALL" >> $GITHUB_OUTPUT
              echo "test_files=all" >> $GITHUB_OUTPUT
            else
              echo "test_mode=DISPATCH" >> $GITHUB_OUTPUT
              echo "test_files=$SELECTED_SUITE" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Install Dependencies
        if: steps.detect.outputs.test_mode != 'SKIP'
        run: npm ci

      - name: Cache Playwright Browsers
        if: steps.detect.outputs.test_mode != 'SKIP'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (Binary & OS Deps)
        if: steps.detect.outputs.test_mode != 'SKIP' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install OS Dependencies only (when cache hit)
        if: steps.detect.outputs.test_mode != 'SKIP' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate .env.${{ inputs.environment || 'dev' }} file from Secrets
        if: steps.detect.outputs.test_mode != 'SKIP'
        env:
          TARGET_ENV: ${{ inputs.environment || 'dev' }}
          UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.BASIC_AUTH_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LOGIN_TYPE: ${{ secrets.LOGIN_TYPE || '1' }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ENV_FILE=".env.${TARGET_ENV}"
          # Đồng bộ mật khẩu Admin dev hợp lệ nếu secret trên GitHub chưa kịp cập nhật
          if [ "$TARGET_ENV" = "dev" ] && { [ -z "$ADMIN_PASSWORD" ] || [ "$ADMIN_PASSWORD" = "!Ch4ng3Th1sP4ssW0rd!" ]; }; then
            ADMIN_PASSWORD="!Ch4ng3Th1sP4ssW0rd!1"
          fi
          cat <<EOF > "$ENV_FILE"
          UI_BASE_URL=${UI_BASE_URL}
          API_BASE_URL=${API_BASE_URL}
          BASIC_AUTH_USER=${BASIC_AUTH_USER}
          BASIC_AUTH_PASS=${BASIC_AUTH_PASS}
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_ID=${ADMIN_ID}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          LOGIN_TYPE=${LOGIN_TYPE}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          EOF
          echo "✅ Đã tạo file cấu hình $ENV_FILE thành công."

      - name: Pre-flight Backend Health Check
        if: steps.detect.outputs.test_mode != 'SKIP'
        env:
          TARGET_ENV: ${{ inputs.environment || 'dev' }}
        run: |
          source ".env.${TARGET_ENV}"
          echo "🔍 Kiểm tra trạng thái kết nối tới: $API_BASE_URL/api/v1/common/version..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$API_BASE_URL/api/v1/common/version" -u "$BASIC_AUTH_USER:$BASIC_AUTH_PASS" || echo "000")
          echo "HTTP Status Code nhận về: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "502" ] || [ "$HTTP_STATUS" = "503" ] || [ "$HTTP_STATUS" = "504" ] || [ "$HTTP_STATUS" = "000" ]; then
            echo "::error::❌ Máy chủ Backend API ($API_BASE_URL) hiện không phản hồi (Mã lỗi: HTTP $HTTP_STATUS). Hủy bỏ lượt chạy test ngay lập tức để tránh lãng phí thời gian retry vô ích."
            exit 1
          fi
          echo "✅ Máy chủ Backend phản hồi bình thường."

      - name: Execute Playwright Tests
        env:
          ENV: ${{ inputs.environment || 'dev' }}
          WORKERS: ${{ inputs.workers || '2' }}
          CI: true
          TEST_MODE: ${{ steps.detect.outputs.test_mode }}
          TEST_FILES: ${{ steps.detect.outputs.test_files }}
        run: |
          FAIL_FAST_FLAG="--max-failures=5"

          if [ "$TEST_MODE" = "SKIP" ]; then
            echo "⏩ [SKIP] Nhánh này chỉ sửa tài liệu / hình ảnh / meta. Bỏ qua chạy test để tiết kiệm thời gian!"
            exit 0
          fi

          if [ "$TEST_MODE" = "TARGETED" ] || [ "$TEST_MODE" = "SMOKE" ]; then
            echo "🎯 [${TEST_MODE}] Đang thực thi các file test được chọn lọc:"
            echo "$TEST_FILES"
            ENV=$ENV npx playwright test $TEST_FILES $FAIL_FAST_FLAG
            exit 0
          fi

          if [ "$TEST_MODE" = "DISPATCH" ]; then
            case "$TEST_FILES" in
              ad100)
                ENV=$ENV npx playwright test tests/**/ad100.*.spec.js $FAIL_FAST_FLAG
                ;;
              api)
                ENV=$ENV npx playwright test tests/api $FAIL_FAST_FLAG
                ;;
              ui)
                ENV=$ENV npx playwright test tests/ui $FAIL_FAST_FLAG
                ;;
              e2e)
                ENV=$ENV npx playwright test tests/e2e $FAIL_FAST_FLAG
                ;;
              smoke-aa000)
                ENV=$ENV npx playwright test tests/**/aa000.*.spec.js $FAIL_FAST_FLAG
                ;;
              gacha-limited)
                ENV=$ENV npx playwright test tests/ui/aq201.ui.spec.js $FAIL_FAST_FLAG
                ;;
              *)
                ENV=$ENV npx playwright test $FAIL_FAST_FLAG
                ;;
            esac
            exit 0
          fi

          # Mặc định: Mode ALL (Nightly Build)
          echo "🌙 [ALL] Đang thực thi TOÀN BỘ Test Suite (Nightly Build)..."
          ENV=$ENV npx playwright test $FAIL_FAST_FLAG

      - name: Upload HTML Test Report Artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.detect.outputs.test_mode != 'SKIP'
        with:
          name: playwright-report-${{ inputs.environment || 'dev' }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload Traces & Failure Evidence
        uses: actions/upload-artifact@v4
        if: failure() && steps.detect.outputs.test_mode != 'SKIP'
        with:
          name: test-failure-evidence-${{ github.run_id }}
          path: |
            test-results/
            temp_trace/
          retention-days: 14

  deploy-report:
    name: Publish Report to GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download HTML Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report-${{ inputs.environment || 'dev' }}-${{ github.run_id }}
          path: ./report

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
